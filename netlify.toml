[build]
  publish = "."

# --- Caching for the embedded Mills Maths Adventure game -------------------
# Long-cache the game's content-hashed build assets (Vite fingerprints these
# filenames on every build, so a change always produces a new URL — safe to
# cache "forever"). Repeat visits reuse them instantly with zero re-download.
[[headers]]
  for = "/game-platforms/mills-maths-adventure/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache the 3D models (now WebP + meshopt compressed, ~8 MB total). Their
# filenames are STABLE (not hashed), so use a moderate 1-day TTL: returning
# players get instant loads within the day, and an updated model still reaches
# them within 24h. Once the models are final you can bump this to
# "public, max-age=31536000, immutable" for permanent caching.
[[headers]]
  for = "/game-platforms/mills-maths-adventure/models/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
